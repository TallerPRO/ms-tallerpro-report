# Agregar estos servicios a compose-apps.yml (ec2-apps), junto a jobs-svc,
# catalog-svc, notify-svc, audit-svc. report-svc usa su propia base
# PostgreSQL (report-db), separada de las Oracle de jobs/catalog/audit.

services:
  report-db:
    image: postgres:16-alpine
    container_name: tallerpro-report-db
    environment:
      POSTGRES_DB: tallerpro_report
      POSTGRES_USER: tallerpro
      POSTGRES_PASSWORD: tallerpro
    volumes:
      - report-db-data:/var/lib/postgresql/data
    networks:
      - tallerpro-net         # misma red que ../docker-compose.infra.yml (kafka, rabbitmq)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallerpro -d tallerpro_report"]
      interval: 5s
      timeout: 5s
      retries: 5

  report-svc:
    build:
      context: ../ms-tallerpro-report
      dockerfile: Dockerfile
    container_name: tallerpro-report-svc
    depends_on:
      report-db:
        condition: service_healthy
    environment:
      DB_HOST: report-db
      DB_PORT: 5432
      DB_NAME: tallerpro_report
      DB_USER: tallerpro
      DB_PASSWORD: tallerpro
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_API_CLIENT_ID: ${AZURE_REPORT_API_CLIENT_ID}   # la app lee AZURE_API_CLIENT_ID
    ports:
      - "8085:8085"
    networks:
      - tallerpro-net         # misma red que ../docker-compose.infra.yml (kafka, rabbitmq)

volumes:
  report-db-data:

networks:
  tallerpro-net:
    external: true
